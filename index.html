<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>By Any Means</title>
  <style>
    body { margin: 0; overflow: hidden; background: #111; font-family: system-ui, sans-serif; touch-action: none; }
    #ui {
      position: fixed; top: 10px; left: 10px; color: #eee; font-size: 14px;
      text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 10;
    }
    #crosshair {
      position: fixed; top: 50%; left: 50%; width: 12px; height: 12px;
      border: 2px solid #fff; border-radius: 50%; transform: translate(-50%, -50%);
      pointer-events: none; z-index: 5;
    }
    .joystick {
      position: fixed; width: 120px; height: 120px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4);
      z-index: 20; touch-action: none;
    }
    #leftJoy { bottom: 30px; left: 30px; }
    #rightJoy { bottom: 30px; right: 30px; }
    .stick {
      position: absolute; width: 50px; height: 50px; border-radius: 50%;
      background: rgba(255,255,255,0.6); top: 50%; left: 50%;
      transform: translate(-50%, -50%);
    }
    #msg {
      position: fixed; bottom: 160px; left: 50%; transform: translateX(-50%);
      color: #ffcc00; font-size: 16px; text-align: center; max-width: 90%;
      text-shadow: 0 1px 3px #000; pointer-events: none; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div>Zombies remaining: <span id="zombieCount">5</span></div>
    <div>Health: <span id="health">100</span></div>
    <div style="font-size:12px; opacity:0.8; margin-top:4px;">Left stick: move | Right: look | Tap right side: shoot</div>
  </div>
  <div id="crosshair"></div>
  <div id="msg">You wake up at the campsite by the lake. Something feels wrong...</div>
  <div class="joystick" id="leftJoy"><div class="stick" id="leftStick"></div></div>
  <div class="joystick" id="rightJoy"><div class="stick" id="rightStick"></div></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
    import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

    // ---------- Deterministic RNG (same world every load) ----------
    const SEED = Number(new URLSearchParams(location.search).get('seed')) || 1337;
    function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
    const rand = mulberry32(SEED);
    const rr = (a, b) => a + rand() * (b - a);
    const pick = arr => arr[Math.floor(rand() * arr.length)];
    const DEBUG = new URLSearchParams(location.search).has('debug');
    const VIEW = new URLSearchParams(location.search).get('view');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xbcdcf0);
    scene.fog = new THREE.Fog(0xc8dfe8, 40, 105);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 110);
    const isMobile = matchMedia('(pointer: coarse)').matches;
    const renderer = new THREE.WebGLRenderer({ antialias: !isMobile, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, isMobile ? 1.25 : 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const hemi = new THREE.HemisphereLight(0xfff3dc, 0x6f8f4f, 1.15);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffe2b8, 1.9);
    sun.castShadow = true;
    sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
    Object.assign(sun.shadow.camera, { left: -28, right: 28, top: 28, bottom: -28, near: 1, far: 120 });
    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.04;
    const SUN_OFFSET = new THREE.Vector3(30, 50, 20);
    scene.add(sun, sun.target);

    // ---------- Layout: lake, camp, paths, clearings ----------
    const LAKE = { x: 15, z: 10, r: 18 };
    const CAMP = { x: -5, z: -5, r: 9 };
    const WORLD_R = 92;
    const PATHS = [ // polylines (x,z)
      [[-5, -5], [2, -1], [6, 3]],                       // camp -> lake shore
      [[-5, -5], [-12, -18], [-14, -34], [-8, -55], [0, -78]], // camp -> north trail
      [[-5, -5], [-22, -2], [-40, 6], [-62, 2]],          // camp -> west trail
      [[6, 3], [34, -14], [52, -30]],                     // shore -> east
    ];
    const CLEARINGS = [CAMP, { x: -40, z: 6, r: 8 }, { x: -14, z: -34, r: 7 }, { x: 40, z: 40, r: 10 }, { x: 52, z: -30, r: 7 }];
    function distToSeg(px, pz, ax, az, bx, bz) {
      const dx = bx - ax, dz = bz - az; const t = Math.max(0, Math.min(1, ((px - ax) * dx + (pz - az) * dz) / (dx * dx + dz * dz)));
      return Math.hypot(px - (ax + t * dx), pz - (az + t * dz));
    }
    function pathDist(x, z) { let d = 1e9; for (const p of PATHS) for (let i = 0; i < p.length - 1; i++) d = Math.min(d, distToSeg(x, z, p[i][0], p[i][1], p[i + 1][0], p[i + 1][1])); return d; }
    const lakeDist = (x, z) => Math.hypot(x - LAKE.x, z - LAKE.z) - LAKE.r;
    function inClearing(x, z, pad = 0) { return CLEARINGS.some(c => Math.hypot(x - c.x, z - c.z) < c.r + pad); }

    // ---------- Ground with painted vertex colours (grass / dirt paths / sand rim) ----------
    {
      const g = new THREE.PlaneGeometry(220, 220, 110, 110); g.rotateX(-Math.PI / 2);
      const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
      const grassA = new THREE.Color(0x6aa04a), grassB = new THREE.Color(0x8db552), dirt = new THREE.Color(0xb08a5a), sand = new THREE.Color(0xd9c28c), c = new THREE.Color();
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), z = pos.getZ(i);
        const n = 0.5 + 0.25 * Math.sin(x * 0.13 + Math.sin(z * 0.07) * 2) + 0.25 * Math.sin(z * 0.11 - x * 0.05);
        c.copy(grassA).lerp(grassB, n);
        const pd = pathDist(x, z); if (pd < 2.2) c.lerp(dirt, Math.min(1, (2.2 - pd) / 1.2));
        const cd = Math.hypot(x - CAMP.x, z - CAMP.z); if (cd < 6) c.lerp(dirt, 0.55 * (1 - cd / 6));
        const ld = lakeDist(x, z); if (ld < 3) c.lerp(sand, Math.min(1, (3 - ld) / 2));
        col.set([c.r, c.g, c.b], i * 3);
      }
      g.setAttribute('color', new THREE.BufferAttribute(col, 3));
      const ground = new THREE.Mesh(g, new THREE.MeshLambertMaterial({ vertexColors: true }));
      ground.receiveShadow = true; scene.add(ground);
      const lake = new THREE.Mesh(new THREE.CircleGeometry(LAKE.r, 48), new THREE.MeshLambertMaterial({ color: 0x3f9fd6, transparent: true, opacity: 0.85 }));
      lake.rotation.x = -Math.PI / 2; lake.position.set(LAKE.x, 0.04, LAKE.z); scene.add(lake);
    }

    // ---------- Asset catalogue (normalised by bounding box at load) ----------
    const T = 'assets/trees/';
    const CATALOG = {
      broad: [ 'broadleaf_mature', 'broadleaf_mature_bushy', 'broadleaf_mature_dense', 'broadleaf_mature_irregular', 'broadleaf_mature_large_spreading', 'broadleaf_mature_medium_rounded_healthy', 'broadleaf_leaning', 'broadleaf_sidebranches', 'broadleaf_wide_low', 'broadleaf_young_sparse', 'broadleaf_broken_regrowth' ].map(n => ({ url: T + n + '.glb', h: [6, 9.5], r: 0.6, wind: 1 })),
      pine: [ 'pine_mature', 'pine_mature_full_base', 'pine_mature_medium_bushy', 'pine_mature_tall_lean', 'pine_mature_tall_straight_dense', 'pine_windswept' ].map(n => ({ url: T + n + '.glb', h: [8, 13], r: 0.55, wind: 0.6 })),
      rock: [ { url: 'assets/rocks/rock.glb', h: [0.5, 1.4], r: 0.7 }, { url: 'assets/rocks/rock_cluster.glb', h: [0.4, 0.9], r: 0.8 } ],
      boulder: [ { url: 'assets/rocks/rock.glb', h: [1.8, 3.2], r: 1.6 } ],
      stump: [ { url: 'assets/wood/stump.glb', h: [0.35, 0.6], r: 0.5 }, { url: 'assets/wood/stump_large.glb', h: [0.6, 0.9], r: 0.9 } ],
      log: [ { url: 'assets/wood/log.glb', len: [2.2, 3.4], r: 0 } ],
      grass: [ { url: 'assets/plants/grass_2_a_singlesided_color1.glb', h: [0.35, 0.6], r: 0, noShadow: true } ],
    };

    // ---------- Seeded placement ----------
    const placed = []; // {x,z,r}
    const colliders = [];
    const instances = new Map(); // url -> [{x,z,s,ry,tint,def}]
    function free(x, z, r, opts = {}) {
      if (Math.hypot(x, z) > WORLD_R) return false;
      if (lakeDist(x, z) < (opts.lake ?? 2.5) + r) return false;
      if (opts.path !== false && pathDist(x, z) < (opts.pathPad ?? 2.4) + r) return false;
      if (opts.clearing !== false && inClearing(x, z, r)) return false;
      if (Math.hypot(x, z) < 4 + r) return false; // player spawn
      for (const p of placed) if (Math.hypot(x - p.x, z - p.z) < r + p.r) return false;
      return true;
    }
    function add(kind, x, z, extra = {}) {
      const def = extra.def || pick(CATALOG[kind]);
      const inst = { x, z, ry: extra.ry ?? rand() * Math.PI * 2, hRand: rand(), tilt: extra.tilt ?? 0, tint: extra.tint ?? rr(0.85, 1.1), def, sink: extra.sink ?? 0 };
      if (!instances.has(def.url)) instances.set(def.url, []);
      instances.get(def.url).push(inst);
      return inst;
    }
    function tryPlace(kind, x, z, spacing, opts) {
      if (!free(x, z, spacing, opts)) return null;
      placed.push({ x, z, r: spacing });
      const inst = add(kind, x, z, opts);
      if (kind === 'broad' || kind === 'pine' || kind === 'boulder') colliders.push({ x, z, r: kind === 'boulder' ? 1.3 : 0.5 });
      return inst;
    }
    // forest clusters (mixed / pine-heavy / broadleaf-heavy)
    for (let c = 0; c < 26; c++) {
      const a = rand() * Math.PI * 2, d = rr(24, 82); const cx = Math.cos(a) * d, cz = Math.sin(a) * d;
      const pineBias = cz < -20 ? 0.75 : 0.35; // north = pine woods, south = leafy
      const n = Math.floor(rr(6, 13));
      for (let i = 0; i < n * 3 && i < 40; i++) {
        const x = cx + (rand() + rand() - 1) * 10, z = cz + (rand() + rand() - 1) * 10;
        tryPlace(rand() < pineBias ? 'pine' : 'broad', x, z, 2.4, {});
      }
    }
    // sparse lone trees across the meadow
    for (let i = 0; i < 40; i++) tryPlace(rand() < 0.4 ? 'pine' : 'broad', rr(-85, 85), rr(-85, 85), 3, {});
    // boulders and rock scatter (rocks also along paths & shore)
    for (let i = 0; i < 14; i++) tryPlace('boulder', rr(-80, 80), rr(-80, 80), 2, {});
    for (let i = 0; i < 70; i++) tryPlace('rock', rr(-85, 85), rr(-85, 85), 0.8, { pathPad: 1.2, sink: 0.12 });
    for (let i = 0; i < 18; i++) { const a = rand() * Math.PI * 2, d = LAKE.r + rr(1.2, 3); tryPlace('rock', LAKE.x + Math.cos(a) * d, LAKE.z + Math.sin(a) * d, 0.6, { lake: 0.6, path: false, clearing: false, sink: 0.15 }); }
    // stumps and fallen logs near forests
    for (let i = 0; i < 26; i++) tryPlace('stump', rr(-80, 80), rr(-80, 80), 0.8, {});
    for (let i = 0; i < 18; i++) tryPlace('log', rr(-80, 80), rr(-80, 80), 1.6, {});
    // bushes hug trees, grass tufts everywhere outside paths
    const trees = placed.filter(p => p.r > 2);
    for (let i = 0; i < 60; i++) { const t = pick(trees); const a = rand() * 6.28, d = rr(1.6, 3.2); tryPlace(rand() < 0.5 ? 'rock' : 'stump', t.x + Math.cos(a) * d, t.z + Math.sin(a) * d, 0.6, { pathPad: 1.0, sink: 0.1 }); }
    for (let i = 0; i < 700; i++) { const x = rr(-80, 80), z = rr(-80, 80); if (Math.hypot(x, z) < WORLD_R && lakeDist(x, z) > 1 && pathDist(x, z) > 1.6 && Math.hypot(x - CAMP.x, z - CAMP.z) > 4.5) add('grass', x, z); }

    // ---------- Campfire area ----------
    const FIRE = { x: CAMP.x, z: CAMP.z };
    const fireLight = new THREE.PointLight(0xff9a3c, 6, 12, 1.6);
    fireLight.position.set(FIRE.x, 1.0, FIRE.z); scene.add(fireLight);
    colliders.push({ x: FIRE.x, z: FIRE.z, r: 0.8 });
    // log benches around the fire, a stump seat, a tent and a woodpile
    for (const [a, len] of [[0.3, 2.6], [2.4, 2.4]]) add('log', FIRE.x + Math.cos(a) * 2.6, FIRE.z + Math.sin(a) * 2.6, { ry: -a + Math.PI / 2, def: { ...CATALOG.log[0], len: [len, len] }, tint: 1 });
    add('stump', FIRE.x + Math.cos(4.3) * 2.4, FIRE.z + Math.sin(4.3) * 2.4, { def: CATALOG.stump[0], tint: 1 });
    for (const [dz, up] of [[0, 0], [0.42, 0], [0.21, 0.75]]) add('log', CAMP.x - 5.5, CAMP.z + 1.5 + dz, { ry: 0, def: { ...CATALOG.log[0], len: [1.8, 1.8] }, tint: 0.95, sink: -up });
    colliders.push({ x: CAMP.x - 5.5, z: CAMP.z + 1.7, r: 0.9 });
    for (let i = 0; i < 5; i++) { const a = i / 5 * 6.28; add('rock', FIRE.x + Math.cos(a) * 0.95, FIRE.z + Math.sin(a) * 0.95, { def: { ...CATALOG.rock[0], h: [0.28, 0.35] }, sink: 0.05 }); }
    colliders.push({ x: CAMP.x + 3.5, z: CAMP.z - 4, r: 1.4 });

    // ---------- Loading + instancing ----------
    const loader = new GLTFLoader();
    loader.setMeshoptDecoder(MeshoptDecoder);
    const sharedMats = new Map(); // one material per source material (palette is shared by all forge assets)
    const windUniforms = { uTime: { value: 0 } };
    function windify(mat, strength) {
      mat.onBeforeCompile = sh => {
        sh.uniforms.uTime = windUniforms.uTime;
        sh.vertexShader = 'uniform float uTime;\nattribute float _wind_sway;\n' + sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>
          #ifdef USE_INSTANCING
            float ph = instanceMatrix[3].x * 0.21 + instanceMatrix[3].z * 0.17;
          #else
            float ph = 0.0;
          #endif
          float sw = _wind_sway * ${strength.toFixed(2)};
          transformed.x += sin(uTime * 1.3 + ph) * 0.08 * sw * position.y;
          transformed.z += cos(uTime * 1.1 + ph) * 0.05 * sw * position.y;`);
      };
      mat.customProgramCacheKey = () => 'wind' + strength;
    }
    function materialFor(m, hasWind, wind) {
      const key = m.name + '|' + (m.map ? m.map.uuid : '') + '|' + (hasWind ? wind : 0);
      if (!sharedMats.has(key)) {
        const mm = new THREE.MeshLambertMaterial({ map: m.map || null, vertexColors: !!m.vertexColors, side: m.side, alphaTest: m.alphaTest || (m.transparent ? 0.5 : 0), color: m.color });
        if (hasWind && wind) windify(mm, wind);
        sharedMats.set(key, mm);
      }
      return sharedMats.get(key);
    }
    // Collect merged LOD geometries from a glTF: forge GLBs carry *_LOD0/1/2; pick LOD1 near, LOD2 far (LOD0 is too heavy for mobile).
    function extractLods(root) {
      root.updateMatrixWorld(true);
      const meshes = []; root.traverse(o => { if (o.isMesh) meshes.push(o); });
      const byLod = { 0: [], 1: [], 2: [] };
      for (const m of meshes) { const l = /_LOD(\d)/.exec(m.name); byLod[l ? +l[1] : 0].push(m); }
      const build = list => {
        if (!list.length) return null;
        const geos = list.map(m => { const g = m.geometry.clone(); g.applyMatrix4(m.matrixWorld); g.morphAttributes = {}; return g; });
        const keep = Object.keys(geos[0].attributes).filter(k => geos.every(g => g.attributes[k]));
        geos.forEach(g => { for (const k of Object.keys(g.attributes)) if (!keep.includes(k)) g.deleteAttribute(k); });
        return { geo: geos.length > 1 ? mergeGeometries(geos) : geos[0], mat: list[0].material };
      };
      const near = build(byLod[1].length ? byLod[1] : byLod[0]);
      const far = build(byLod[2].length ? byLod[2] : (byLod[1].length ? byLod[1] : byLod[0]));
      return { near, far };
    }
    const groups = []; // {near:InstancedMesh, far:InstancedMesh, list}
    const tmpM = new THREE.Matrix4(), tmpQ = new THREE.Quaternion(), tmpE = new THREE.Euler(), tmpS = new THREE.Vector3(), tmpP = new THREE.Vector3(), tmpC = new THREE.Color();
    function buildGroup(url, list, lods) {
      const g0 = lods.near.geo; g0.computeBoundingBox();
      const bb = g0.boundingBox, size = bb.getSize(new THREE.Vector3());
      for (const it of list) {
        const d = it.def; let s;
        if (d.len) { s = rr(d.len[0], d.len[1]) / Math.max(size.x, size.z); }
        else s = (d.h[0] + it.hRand * (d.h[1] - d.h[0])) / size.y;
        it.scale = s;
        it.y = -bb.min.y * s - it.sink * size.y * s; // ground it, optionally sink a bit
        tmpE.set(it.tilt, it.ry, 0); tmpQ.setFromEuler(tmpE); tmpS.setScalar(s); tmpP.set(it.x, it.y, it.z);
        it.matrix = new THREE.Matrix4().compose(tmpP, tmpQ, tmpS);
      }
      const mk = (lod, castShadow) => {
        const hasWind = !!lod.geo.attributes._wind_sway;
        const mat = materialFor(lod.mat, hasWind, list[0].def.wind || 0);
        const im = new THREE.InstancedMesh(lod.geo, mat, list.length);
        im.castShadow = castShadow && !list[0].def.noShadow; im.receiveShadow = true;
        list.forEach((it, i) => im.setColorAt(i, tmpC.setScalar(it.tint)));
        im.count = 0; im.frustumCulled = false; scene.add(im); return im;
      };
      const grp = { near: mk(lods.near, true), far: lods.far.geo === lods.near.geo ? null : mk(lods.far, false), list, nearDist: list[0].def.h && list[0].def.h[1] > 3 ? (isMobile ? 20 : 28) : 24 };
      if (list[0].def === CATALOG.grass[0]) grp.nearDist = 1e9; // tiny, keep single LOD
      groups.push(grp); updateLods(true);
    }
    let lastLodPos = new THREE.Vector3(1e9, 0, 0), lastLodYaw = 0;
    function updateLods(force) {
      const p = player ? player.position : new THREE.Vector3();
      const fy = (typeof yaw === 'number') ? yaw : 0;
      if (!force && p.distanceToSquared(lastLodPos) < 4 && Math.abs(fy - lastLodYaw) < 0.15) return;
      lastLodPos.copy(p); lastLodYaw = fy;
      // camera looks along -forward(yaw); keep a generous cone (works for any aspect) + everything close
      const fx = -Math.sin(fy), fz = -Math.cos(fy), cosLim = Math.cos(Math.min(Math.PI, (camera.fov * Math.max(1, camera.aspect)) * Math.PI / 360 + 0.5)) - (VIEW ? 2 : 0);
      for (const g of groups) {
        let n = 0, f = 0;
        for (const it of g.list) {
          const d = Math.hypot(it.x - p.x, it.z - p.z);
          if (d > 105) continue; // beyond fog
          if (d > 14 && ((it.x - p.x) * fx + (it.z - p.z) * fz) / d < cosLim) continue; // behind camera
          if (!g.far || d < g.nearDist) g.near.setMatrixAt(n++, it.matrix), g.near.instanceColor && g.near.instanceColor.setXYZ(n - 1, it.tint, it.tint, it.tint);
          else g.far.setMatrixAt(f++, it.matrix), g.far.instanceColor.setXYZ(f - 1, it.tint, it.tint, it.tint);
        }
        g.near.count = n; g.near.instanceMatrix.needsUpdate = true; if (g.near.instanceColor) g.near.instanceColor.needsUpdate = true;
        if (g.far) { g.far.count = f; g.far.instanceMatrix.needsUpdate = true; g.far.instanceColor.needsUpdate = true; }
      }
    }
    // Lazy load: nearest/most important first, a few at a time; game is playable immediately.
    const queue = [...instances.entries()].sort((a, b) => {
      const near = l => Math.min(...l.map(it => Math.hypot(it.x, it.z)));
      return near(a[1]) - near(b[1]);
    });
    let loadedCount = 0, failed = 0;
    async function loadAll() {
      queue.unshift(['assets/props/campfire.glb', null], ['assets/props/tent.glb', null]);
      const worker = async () => {
        while (queue.length) {
          const [url, list] = queue.shift();
          try {
            const gltf = await loader.loadAsync(url);
            if (!list) placeSingle(url, gltf.scene); else buildGroup(url, list, extractLods(gltf.scene));
            loadedCount++;
          } catch (e) { failed++; console.warn('Failed to load', url, e); }
        }
      };
      await Promise.all([worker(), worker(), worker()]);
      console.log('[BAM] assets loaded', loadedCount, 'failed', failed);
      window.__bamReady = true;
    }
    function placeSingle(url, root) {
      const box = new THREE.Box3().setFromObject(root), size = box.getSize(new THREE.Vector3());
      const isFire = url.includes('campfire');
      const s = isFire ? 1.4 / Math.max(size.x, size.z) : 3.2 / size.y;
      root.scale.setScalar(s);
      if (isFire) root.position.set(FIRE.x, -box.min.y * s, FIRE.z);
      else { root.position.set(CAMP.x + 3.5, -box.min.y * s, CAMP.z - 4); root.rotation.y = -2.3; }
      root.traverse(o => { if (o.isMesh) { o.castShadow = !isFire; o.receiveShadow = true; } });
      scene.add(root);
    }
    loadAll();

    // Player
    var player; player = new THREE.Mesh(
      new THREE.CapsuleGeometry(0.4, 1.2, 4, 8),
      new THREE.MeshLambertMaterial({ color: 0x3366aa })
    );
    player.position.set(0, 1.2, 0);
    player.castShadow = true;
    scene.add(player);

    const camOffset = new THREE.Vector3(0, 3.5, 6);
    let yaw = 0;
    let pitch = 0.2;

    // Zombies
    const zombies = [];
    const zombieCountEl = document.getElementById('zombieCount');
    let remaining = 5;
    function spawnZombie(x, z) {
      const zom = new THREE.Mesh(
        new THREE.CapsuleGeometry(0.4, 1.4, 4, 8),
        new THREE.MeshLambertMaterial({ color: 0x556655 })
      );
      zom.position.set(x, 1.1, z);
      zom.castShadow = true;
      zom.userData = { speed: 1.2 + Math.random()*0.6, health: 2, isZombie: true };
      scene.add(zom);
      zombies.push(zom);
    }
    // spawn at the tree line, never in the lake or inside camp
    [[-16, 12], [-20, -16], [4, -18], [24, -16], [-26, 4]].forEach(([x, z]) => spawnZombie(x, z));
    function updateCount() { zombieCountEl.textContent = remaining; }
    updateCount();

    // Input
    const keys = {};
    let moveX = 0, moveZ = 0;
    let lookX = 0, lookY = 0;

    function setupJoystick(joyEl, stickEl, onMove) {
      let active = false, startX, startY;
      const max = 50;
      joyEl.addEventListener('pointerdown', e => {
        active = true;
        startX = e.clientX; startY = e.clientY;
        joyEl.setPointerCapture(e.pointerId);
      });
      joyEl.addEventListener('pointermove', e => {
        if (!active) return;
        let dx = e.clientX - startX;
        let dy = e.clientY - startY;
        const dist = Math.hypot(dx, dy);
        if (dist > max) { dx = dx/dist*max; dy = dy/dist*max; }
        stickEl.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        onMove(dx/max, dy/max);
      });
      const end = () => {
        active = false;
        stickEl.style.transform = 'translate(-50%, -50%)';
        onMove(0, 0);
      };
      joyEl.addEventListener('pointerup', end);
      joyEl.addEventListener('pointercancel', end);
    }

    setupJoystick(document.getElementById('leftJoy'), document.getElementById('leftStick'), (x, y) => {
      moveX = x;
      moveZ = -y;
    });
    setupJoystick(document.getElementById('rightJoy'), document.getElementById('rightStick'), (x, y) => {
      lookX = x;
      lookY = y;
    });

    renderer.domElement.addEventListener('pointerdown', e => {
      if (e.clientX > window.innerWidth * 0.5) shoot();
    });

    function shoot() {
      const raycaster = new THREE.Raycaster();
      const dir = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
      raycaster.set(player.position.clone().add(new THREE.Vector3(0, 1.2, 0)), dir);
      const hits = raycaster.intersectObjects(zombies);
      if (hits.length) {
        const z = hits[0].object;
        z.userData.health--;
        if (z.userData.health <= 0) {
          scene.remove(z);
          zombies.splice(zombies.indexOf(z), 1);
          remaining--;
          updateCount();
          if (remaining <= 0) document.getElementById('msg').textContent = 'Area clear for now. More will come...';
        } else {
          z.material.color.set(0xaa4444);
          setTimeout(() => z.material.color.set(0x556655), 150);
        }
      }
    }

    window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
    window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

    const clock = new THREE.Clock();
    let health = 100;
    const healthEl = document.getElementById('health');

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      let dx = moveX, dz = moveZ;
      if (keys['w'] || keys['arrowup']) dz += 1;
      if (keys['s'] || keys['arrowdown']) dz -= 1;
      if (keys['a'] || keys['arrowleft']) dx -= 1;
      if (keys['d'] || keys['arrowright']) dx += 1;

      yaw -= lookX * 2.5 * dt;
      pitch = Math.max(-0.8, Math.min(0.6, pitch - lookY * 1.8 * dt));
      if (keys['q']) yaw += 1.5 * dt;
      if (keys['e']) yaw -= 1.5 * dt;

      const speed = 6;
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)); // camera looks along -z at yaw 0
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const move = forward.multiplyScalar(dz).add(right.multiplyScalar(dx)).normalize().multiplyScalar(speed * dt);
      if (dx || dz) player.position.add(move);
      for (const c of colliders) { const ox = player.position.x - c.x, oz = player.position.z - c.z, d = Math.hypot(ox, oz), m = c.r + 0.4; if (d < m && d > 1e-4) { player.position.x = c.x + ox / d * m; player.position.z = c.z + oz / d * m; } }
      const pd = Math.hypot(player.position.x, player.position.z); if (pd > WORLD_R) player.position.multiplyScalar(WORLD_R / pd);
      if (lakeDist(player.position.x, player.position.z) < -1) { const lx = player.position.x - LAKE.x, lz = player.position.z - LAKE.z, l = Math.hypot(lx, lz); player.position.x = LAKE.x + lx / l * (LAKE.r - 1); player.position.z = LAKE.z + lz / l * (LAKE.r - 1); }
      updateLods(false);
      windUniforms.uTime.value += dt;
      fireLight.intensity = 5.5 + Math.sin(windUniforms.uTime.value * 13) * 0.6 + Math.sin(windUniforms.uTime.value * 7.3) * 0.5;
      sun.position.copy(player.position).add(SUN_OFFSET); sun.target.position.copy(player.position);

      const camPos = player.position.clone().add(camOffset.clone().applyEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ')));
      camera.position.copy(camPos);
      camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.4, 0)));
      if (VIEW === 'top') { camera.position.set(-40, 70, 60); camera.lookAt(0, 0, -5); }
      if (VIEW === 'camp') { camera.position.set(-12, 5, 4); camera.lookAt(CAMP.x, 0.5, CAMP.z); }

      zombies.forEach(z => {
        const toPlayer = player.position.clone().sub(z.position);
        toPlayer.y = 0;
        const dist = toPlayer.length();
        if (dist > 1.2) {
          toPlayer.normalize().multiplyScalar(z.userData.speed * dt);
          z.position.add(toPlayer);
          z.lookAt(player.position.x, z.position.y, player.position.z);
        } else if (dist < 1.5 && health > 0) {
          health -= 8 * dt;
          healthEl.textContent = Math.max(0, Math.floor(health));
          if (health <= 0) document.getElementById('msg').textContent = 'You died. Refresh to try again.';
        }
      });

      renderer.render(scene, camera);
      if (DEBUG && (frames++ % 10 === 0)) { const i = renderer.info.render; dbg.textContent = `calls ${i.calls} | tris ${(i.triangles / 1000).toFixed(0)}k | fps ${(1 / Math.max(dt, 1e-3)).toFixed(0)} | assets ${loadedCount}/${instances.size + 2}`; window.__bamStats = { calls: i.calls, triangles: i.triangles }; }
    }
    let frames = 0; const dbg = document.createElement('div');
    if (DEBUG) { dbg.style.cssText = 'position:fixed;top:78px;left:10px;color:#fff;font:12px monospace;z-index:30;text-shadow:0 1px 2px #000'; document.body.appendChild(dbg); }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    if (DEBUG) window.__camera = camera, window.__player = player, window.__renderer = renderer;

    setTimeout(() => {
      const m = document.getElementById('msg');
      if (m.textContent.includes('campsite')) m.textContent = 'Check your phone... messages are coming in.';
    }, 4000);
  </script>
</body>
</html>
